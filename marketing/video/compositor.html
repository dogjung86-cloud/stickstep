<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: "Pretendard Variable", Pretendard, sans-serif;
    letter-spacing: -0.012em;
    background:
      radial-gradient(90% 60% at 50% 0%, var(--glow) 0%, transparent 60%),
      radial-gradient(120% 90% at 50% 10%, #10233C 0%, #0B1524 55%, #070F1C 100%);
    overflow: hidden;
  }
  .phone {
    width: 254px; margin: 30px auto 0;
    border-radius: 36px; padding: 8px;
    background: linear-gradient(180deg, #1D2836 0%, #131C29 100%);
    box-shadow:
      0 24px 60px rgba(2, 8, 20, 0.72),
      0 6px 18px rgba(2, 8, 20, 0.5),
      0 0 0 1px rgba(126, 166, 255, 0.14),
      0 0 44px rgba(110, 168, 255, 0.1);
    opacity: 0; animation: rise .7s cubic-bezier(.22,1,.36,1) .1s forwards;
  }
  .phone video { width: 100%; display: block; border-radius: 28px; background: #0B1524; }
  .copy { text-align: center; margin-top: 24px; padding: 0 22px; }
  .chip {
    display: inline-block; font-size: 11.5px; font-weight: 700; color: #8FB8FF;
    background: rgba(110, 168, 255, 0.13); border: 1px solid rgba(110, 168, 255, 0.22);
    padding: 5px 11px; border-radius: 999px;
    opacity: 0; animation: fadeUp .5s cubic-bezier(.22,1,.36,1) .35s forwards;
  }
  .head {
    margin-top: 12px; font-size: 25px; font-weight: 800; line-height: 1.34; color: #FFFFFF;
    word-break: keep-all;
    opacity: 0; animation: pop .6s cubic-bezier(.34,1.35,.5,1) .5s forwards;
  }
  .head b { color: #6EA8FF; font-weight: 900; }
  .sub {
    margin-top: 9px; font-size: 13px; font-weight: 500; color: #8FA0B5;
    opacity: 0; animation: fadeUp .5s cubic-bezier(.22,1,.36,1) .72s forwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: translateY(16px) scale(.94); } 100% { opacity: 1; transform: none; } }
  /* 녹화 게이트 — __go() 호출 전에는 등장 연출 정지 */
  .phone, .chip, .head, .sub { animation-play-state: paused; }
  body.go .phone, body.go .chip, body.go .head, body.go .sub { animation-play-state: running; }
</style>
</head>
<body>
  <div class="phone"><video id="v" muted playsinline preload="auto"></video></div>
  <div class="copy">
    <div class="chip" id="chip"></div>
    <div class="head" id="head"></div>
    <div class="sub" id="sub"></div>
  </div>
<script>
  const P = new URLSearchParams(location.search);
  document.documentElement.style.setProperty("--glow", P.get("glow") || "rgba(110,168,255,.14)");
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const head = esc(P.get("head") || "");
  const acc = P.get("acc") || "";
  const marked = acc ? head.replace(esc(acc), "<b>" + esc(acc) + "</b>") : head;
  document.getElementById("head").innerHTML = marked.replaceAll("|", "<br>"); // "|" = 강제 줄갈이
  document.getElementById("chip").textContent = P.get("chip") || "";
  document.getElementById("sub").textContent = P.get("sub") || "";
  const v = document.getElementById("v");
  v.src = P.get("v");
  window.__ended = false;
  v.addEventListener("ended", () => { window.__ended = true; });
  // 등장 연출과 영상 재생을 분리 — 쇼츠 스와이프에서는 "완성된 카드"가 통째로 슬라이드 인해야
  // 자연스럽다(비트 안에서 또 떠오르면 이중 전환처럼 읽힘). compose가 __reveal → 대기 → 녹화 → __go.
  window.__reveal = () => { document.body.classList.add("go"); };
  window.__go = (rate) => { document.body.classList.add("go"); v.playbackRate = rate; v.play(); };
  v.addEventListener("canplaythrough", () => { window.__ready = true; }, { once: true });
</script>
</body>
</html>
